<!doctype html>
<meta charset="utf-8">
<title>Silesia wasm32 benchmark</title>
<h1>Silesia wasm32 benchmark</h1>
<pre>Running…
</pre>
<script type="module">
import {benchmark} from './silesia.mjs';
const log = text => document.querySelector('pre').textContent += text + '\n';
const params = new URLSearchParams(location.search);
async function read(path) {
    const response = await fetch('../' + path);
    if (!response.ok) throw Error(path + ': ' + response.status);
    return new Uint8Array(await response.arrayBuffer());
}
try {
    const result = await benchmark({sampleCount: Number(params.get('samples') || 7)}, read, log);
    Object.assign(result, {userAgent: navigator.userAgent, isolated: crossOriginIsolated, date: new Date().toISOString()});
    const response = await fetch('/results/' + (params.get('name') || 'silesia-browser'), {
        method: 'POST', body: JSON.stringify(result, null, 2),
    });
    if (!response.ok) throw Error('Unable to save results');
    log('DONE — all inputs, round trips, and identical stock/patched compressed bytes verified');
    document.title = 'Silesia benchmark complete';
} catch (error) {
    log('ERROR ' + error.stack);
    document.title = 'Silesia benchmark failed';
}
</script>
