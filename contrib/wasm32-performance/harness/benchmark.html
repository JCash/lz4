<!doctype html><meta charset="utf-8"><title>Wasm decoder benchmark</title>
<h1>Wasm decoder benchmark</h1><pre>Running…
</pre><script type="module">
import {benchmark} from './benchmark.mjs';
const log=t=>document.querySelector('pre').textContent+=t+'\n';
const params=new URLSearchParams(location.search);
const variants=(params.get('variants')||'defold194,stock,fast32,fast64,length64,fast32-length64,fast64-length64').split(',');
const cache=new Map();
async function read(name){if(!cache.has(name))cache.set(name,fetch('../'+name).then(r=>{if(!r.ok)throw Error(name);return r.arrayBuffer();}).then(a=>new Uint8Array(a)));return cache.get(name);}
try {
const result=await benchmark({variants,sampleCount:Number(params.get('samples')||9)},read,log);
Object.assign(result,{userAgent:navigator.userAgent,isolated:crossOriginIsolated,date:new Date().toISOString()});
const response=await fetch('/results/'+(params.get('name')||'screening'),{method:'POST',body:JSON.stringify(result,null,2)});
if(!response.ok)throw Error('Unable to save results');
log('DONE — all decoded outputs verified');document.title='Wasm benchmark complete';
}catch(e){log('ERROR '+e.stack);document.title='Wasm benchmark failed';}
</script>
